<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="#050510"/>
  <!-- Star / beam source -->
  <circle cx="32" cy="64" r="8" fill="#4de8ff" opacity="0.9"/>
  <!-- Beam line -->
  <line x1="40" y1="64" x2="72" y2="40" stroke="#4de8ff" stroke-width="2" opacity="0.7"/>
  <line x1="72" y1="40" x2="96" y2="64" stroke="#4de8ff" stroke-width="2" opacity="0.7"/>
  <!-- Mirror diamond -->
  <polygon points="72,32 80,40 72,48 64,40" fill="none" stroke="#a0c8ff" stroke-width="2"/>
  <!-- Target -->
  <circle cx="96" cy="64" r="10" fill="none" stroke="#ffcc33" stroke-width="2.5"/>
  <circle cx="96" cy="64" r="4" fill="#ffcc33"/>
  <!-- Stars (decorative) -->
  <circle cx="20" cy="20" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="108" cy="16" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="14" cy="100" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="112" cy="108" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="56" cy="112" r="1" fill="#ffffff" opacity="0.3"/>
</svg>
